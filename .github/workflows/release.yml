# Release of umbra-setup (ADR 0038 of the Umbra project): on a v* tag the operator pushes, build with
# GoReleaser, sign checksums.txt with cosign keyless, attach SBOMs, and attest build provenance.
# Every action is pinned by commit SHA (resolved from its tag with `git ls-remote`, 2026-11-05).
# Permissions as in https://github.com/goreleaser/goreleaser-example-supply-chain, minus packages.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release and its assets
  id-token: write # cosign keyless signing and the attestation
  attestations: write # build provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # verify: input name
      - run: sudo apt-get update && sudo apt-get install -y zsh shellcheck
      - run: scripts/verify.sh
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean # verify: input name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
