# umbra-setup release (ADR 0038 of the Umbra project). Run by .github/workflows/release.yml on a
# v* tag; never by an agent. Check it on the release machine with `goreleaser check` (verify:
# GoReleaser is not installed where this was written, so the config has not been validated).
#
# Sources (read 2026-11-04): https://goreleaser.com/customization/sign/ (signs: cosign keyless with
# --bundle on the checksum file) and https://github.com/goreleaser/goreleaser-example-supply-chain
# (sboms for archives and source; one signature covers them through checksums.txt).
version: 2 # verify: GoReleaser v2 config schema

project_name: umbra-setup

builds:
  - id: umbra-setup
    main: ./cmd/umbra-setup
    binary: umbra-setup
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: umbra-setup
    # install.sh pins and fetches exactly this name (env/wsl/install/selector.sh, setup_asset).
    name_template: "umbra-setup_{{ .Version }}_linux_{{ .Arch }}"

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_src"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive
  - id: source # two sbom configurations need two ids
    artifacts: source

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes" # needed on cosign 2.0.0+
    artifacts: checksum
    output: true
