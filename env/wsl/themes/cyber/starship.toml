"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 500

format = """
[>>](bold green) $username$hostname$directory$git_branch$git_status$nodejs$python$rust$docker_context$kubernetes
[\\$](bold green) $character"""

right_format = """$cmd_duration"""

[character]
success_symbol = "[>](bold green)"
error_symbol = "[x](bold red)"

[username]
format = "[$user]($style)"
style_user = "bold green"
show_always = true

[hostname]
ssh_only = false
format = "[@$hostname](bold green) "

[directory]
style = "bold green"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "git:"
style = "bold green"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold green"
format = '([\[$all_status$ahead_behind\]]($style) )'

[nodejs]
symbol = "node:"
style = "bold green"
format = "via [$symbol($version )]($style)"

[python]
symbol = "py:"
style = "bold green"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "rs:"
style = "bold green"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = "docker:"
style = "bold green"
format = "via [$symbol$context]($style) "

[kubernetes]
symbol = "k8s:"
style = "bold green"
format = "on [$symbol$context( \\($namespace\\))]($style) "

[cmd_duration]
min_time = 500
style = "bold bright-green"
format = "took [$duration]($style)"
