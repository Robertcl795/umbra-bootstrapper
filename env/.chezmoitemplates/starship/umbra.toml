# Generated by themes/generate.py from brand/tokens/umbra.json — do not edit by hand.
# Umbra prompt (Phase 1, ADR 0013); colors come from the palette below.
"$schema" = 'https://starship.rs/config-schema.json'

palette = "umbra"
add_newline = true
command_timeout = 500

format = """
[╭─](ultraviolet)$username$hostname$directory$git_branch$git_status$nodejs$python$rust$docker_context$kubernetes
[╰─](ultraviolet)$character"""
right_format = """$cmd_duration"""

[character]
success_symbol = "[➜](bold plasma)"
error_symbol = "[✗](bold error)"
vimcmd_symbol = "[←](bold ion)"

[username]
style_user = "ion"
style_root = "bold error"
format = "[$user]($style)@"

[hostname]
ssh_only = true
style = "ash"
format = "[$hostname]($style) "

[directory]
style = "bold starlight"
read_only_style = "error"
truncation_length = 3
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
style = "ultraviolet"
format = "[$symbol$branch]($style) "

[git_status]
style = "corona"
format = "([$all_status$ahead_behind]($style) )"

[nodejs]
style = "ok"
format = "[$symbol($version)]($style) "

[python]
style = "corona"
format = "[$symbol$pyenv_prefix($version)]($style) "

[rust]
style = "error"
format = "[$symbol($version)]($style) "

[docker_context]
style = "link"
format = "[$symbol$context]($style) "

[kubernetes]
disabled = false
style = "plasma"
format = '[$symbol$context( \($namespace\))]($style) '

[cmd_duration]
style = "ash"
min_time = 2000
format = "[$duration]($style)"

[palettes.umbra]
void = "#07060D"
umbra = "#0E0B1A"
penumbra = "#171329"
dusk = "#241E3D"
ash = "#8A84A8"
starlight = "#E8E4F7"
ultraviolet = "#8F73FF"
plasma = "#FF4FAE"
ion = "#2BE4FF"
corona = "#FFC857"
ok = "#3DF5A0"
error = "#FF5C7A"
link = "#6C9BFF"
